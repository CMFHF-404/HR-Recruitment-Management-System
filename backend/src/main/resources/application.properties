spring.application.name=HR Recruitment Management System

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hr_recruitment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:hrms-local-secret-change-me-2026}
app.jwt.ttl-seconds=86400

app.resume.upload-dir=${RESUME_UPLOAD_DIR:uploads/resumes}
app.ai.mode=${AI_MODE:REMOTE}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
